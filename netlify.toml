[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["ejs"]
  included_files = ["src/views/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
